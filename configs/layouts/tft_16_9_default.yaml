    x: 0.40104167
    y: 0.00370370
    w: 0.03541667
    h: 0.03518519
    group: hud
    purpose: OCR stage/round value such as 3-3.

  # Tight OCR-only HUD ROIs calibrated from real 1920x1080 crops.
  # Wider *_value ROIs below are intentionally retained as visual context.
  stage_search_region:
    x: 0.38854167
    y: 0.00370370
    w: 0.05520833
    h: 0.03055556
    group: hud_ocr
    purpose: Search region for stage/round text. Early 1-x rounds render slightly farther right than later stages.

