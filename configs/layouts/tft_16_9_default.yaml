schema_version: 1
profile_id: tft_16_9_default_v4
description: >-
  Initial TFT 16:9 HUD layout calibrated from a real 1920x1080 match capture.
  Coordinates are normalized and resolution-independent, but this profile still
  assumes the default/similar in-game UI scale.
aspect_ratio: 1.7777777778
aspect_ratio_tolerance: 0.02
reference_width: 1920
reference_height: 1080
ui_scale_hint: default
metadata:
  calibrated_on: 1920x1080
  calibration_status: validated_static_rois_with_stage_search_region
  notes: Static HUD/shop ROIs validated on real frames. Stage 2.1.2 adds stage search/localization because early 1-x rounds render farther right. Player HP remains dynamic.

rois:
